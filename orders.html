<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StichKart | My Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #fff;
            min-height: 100vh;
        }


        /* ================= HEADER ================= */

        header {
            height: 78px;
            border-bottom: 1px solid #252525;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background: #090909;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            color: #d4af37;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .customer-name {
            color: #aaa;
            font-size: 14px;
        }

        .logout {
            border: 1px solid #333;
            background: #151515;
            color: #ddd;

            padding: 10px 17px;

            border-radius: 10px;

            cursor: pointer;
        }

        .logout:hover {
            border-color: #d4af37;
            color: #d4af37;
        }


        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 50px auto;
        }

        .hero {
            margin-bottom: 35px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #d4af37;
        }

        .hero p {
            color: #888;
        }


        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .stat {
            background: #111;

            border: 1px solid #252525;

            border-radius: 18px;

            padding: 22px;
        }

        .stat-number {
            font-size: 28px;

            font-weight: 800;

            color: #d4af37;
        }

        .stat-label {
            color: #888;

            font-size: 13px;

            margin-top: 6px;
        }


        /* ================= ORDERS ================= */

        .orders {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: #111;

            border: 1px solid #292929;

            border-radius: 22px;

            padding: 25px;
        }


        /* ================= ORDER TOP ================= */

        .order-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 20px;
        }

        .order-number {
            color: #d4af37;

            font-size: 18px;

            font-weight: 800;
        }

        .date {
            color: #666;

            font-size: 12px;

            margin-top: 6px;
        }

        .status {
            padding: 8px 13px;

            border-radius: 20px;

            background:
                rgba(212, 175, 55, .1);

            border: 1px solid rgba(212, 175, 55, .3);

            color: #e7c85b;

            font-size: 12px;

            white-space: nowrap;
        }


        /* ================= DETAILS ================= */

        .details {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .detail {
            background: #171717;

            padding: 15px;

            border-radius: 13px;
        }

        .detail-label {
            color: #666;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 6px;
        }

        .detail-value {
            color: #eee;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ================= TAILOR BOX ================= */

        .tailor-box {
            background:
                linear-gradient(135deg,
                    rgba(212, 175, 55, .08),
                    rgba(212, 175, 55, .02));

            border: 1px solid rgba(212, 175, 55, .25);

            border-radius: 16px;

            padding: 18px;

            margin-bottom: 25px;
        }

        .tailor-box-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .tailor-label {
            color: #777;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 6px;
        }

        .tailor-name {
            color: #f0d56b;

            font-size: 17px;

            font-weight: 800;
        }

        .tailor-location {
            color: #888;

            font-size: 12px;

            margin-top: 4px;
        }

        .select-tailor-btn {
            border: none;

            background: #d4af37;

            color: #111;

            padding: 11px 17px;

            border-radius: 10px;

            font-weight: 800;

            cursor: pointer;

            white-space: nowrap;
        }

        .select-tailor-btn:hover {
            background: #f0d56b;

            transform: translateY(-1px);
        }

        .change-tailor {
            border: 1px solid #444;

            background: #181818;

            color: #ccc;

            padding: 9px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 12px;
        }

        .change-tailor:hover {
            border-color: #d4af37;

            color: #d4af37;
        }


        /* ================= TIMELINE ================= */

        .timeline {
            display: flex;

            justify-content: space-between;

            position: relative;

            margin: 30px 0;
        }

        .timeline:before {
            content: "";

            position: absolute;

            top: 13px;

            left: 5%;

            right: 5%;

            height: 2px;

            background: #292929;
        }

        .step {
            position: relative;

            z-index: 1;

            text-align: center;

            width: 20%;
        }

        .dot {
            width: 27px;

            height: 27px;

            margin: auto;

            border-radius: 50%;

            background: #242424;

            border: 2px solid #444;
        }

        .step.active .dot {
            background: #d4af37;

            border-color: #f2d675;

            box-shadow:
                0 0 15px rgba(212, 175, 55, .3);
        }

        .step-text {
            margin-top: 9px;

            color: #666;

            font-size: 10px;
        }

        .step.active .step-text {
            color: #ddd;
        }


        /* ================= REFERENCES ================= */

        .reference {
            border-top: 1px solid #252525;

            padding-top: 20px;
        }

        .reference h3 {
            font-size: 15px;

            margin-bottom: 14px;
        }

        .reference-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .ref-btn {
            display: inline-block;

            padding: 11px 15px;

            border-radius: 10px;

            background: #1b1b1b;

            border: 1px solid #333;

            color: #ddd;

            text-decoration: none;

            font-size: 13px;

            cursor: pointer;
        }

        .ref-btn:hover {
            border-color: #d4af37;

            color: #d4af37;
        }


        /* ================= INSTRUCTIONS ================= */

        .instructions {
            margin-top: 20px;

            background: #171717;

            padding: 17px;

            border-radius: 13px;
        }

        .instructions-title {
            color: #777;

            font-size: 11px;

            text-transform: uppercase;

            margin-bottom: 7px;
        }

        .instructions-text {
            color: #ccc;

            font-size: 14px;

            line-height: 1.6;
        }

        .fit {
            margin-top: 12px;

            color: #aaa;

            font-size: 13px;
        }


        /* ================= EMPTY ================= */

        .empty {
            text-align: center;

            padding: 80px 20px;

            background: #111;

            border: 1px solid #252525;

            border-radius: 22px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;

            margin-bottom: 25px;
        }

        .shop {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 12px;

            background: #d4af37;

            color: #111;

            text-decoration: none;

            font-weight: 800;
        }


        /* ================= LOADING ================= */

        .loading {
            text-align: center;

            color: #888;

            padding: 60px;
        }

        .error {
            text-align: center;

            padding: 40px;

            color: #ff9999;
        }


        /* ================= TAILOR MODAL ================= */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .82);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 100%;

            max-width: 700px;

            max-height: 85vh;

            overflow-y: auto;

            background: #121212;

            border: 1px solid rgba(212, 175, 55, .35);

            border-radius: 24px;

            padding: 28px;

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .7);
        }

        .modal-head {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }

        .modal-head h2 {
            font-size: 25px;
        }

        .close {
            width: 38px;

            height: 38px;

            border-radius: 50%;

            border: 1px solid #333;

            background: #1b1b1b;

            color: #aaa;

            cursor: pointer;

            font-size: 20px;
        }

        .close:hover {
            color: #d4af37;

            border-color: #d4af37;
        }

        .tailor-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .tailor-card {
            background: #181818;

            border: 1px solid #2b2b2b;

            border-radius: 17px;

            padding: 18px;

            cursor: pointer;

            transition: .2s;
        }

        .tailor-card:hover {
            border-color: #d4af37;

            transform: translateY(-2px);
        }

        .tailor-card.selected {
            border-color: #d4af37;

            box-shadow:
                0 0 0 1px #d4af37;
        }

        .tailor-avatar {
            width: 50px;

            height: 50px;

            border-radius: 14px;

            background:
                linear-gradient(135deg,
                    #d4af37,
                    #8d721f);

            color: #111;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: 900;

            margin-bottom: 12px;
        }

        .tailor-card-name {
            font-weight: 800;

            margin-bottom: 6px;
        }

        .tailor-card-specialization {
            color: #999;

            font-size: 12px;

            line-height: 1.5;

            min-height: 38px;
        }

        .tailor-card-meta {
            display: flex;

            justify-content: space-between;

            margin-top: 13px;

            padding-top: 12px;

            border-top: 1px solid #292929;

            color: #888;

            font-size: 11px;
        }

        .assign-btn {
            width: 100%;

            margin-top: 12px;

            padding: 11px;

            border: none;

            border-radius: 10px;

            background: #d4af37;

            color: #111;

            font-weight: 800;

            cursor: pointer;
        }


        /* ================= RESPONSIVE ================= */

        @media(max-width:800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .details {
                grid-template-columns:
                    1fr 1fr;
            }

            .tailor-grid {
                grid-template-columns: 1fr;
            }

        }

        @media(max-width:600px) {

            header {
                padding: 0 20px;
            }

            .customer-name {
                display: none;
            }

            .container {
                width: 92%;

                margin-top: 30px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .tailor-box-top {
                align-items: flex-start;

                flex-direction: column;
            }

            .timeline {
                overflow-x: auto;

                min-width: 600px;
            }

            .order-card {
                overflow: hidden;
            }

        }
    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            STICHKART
        </div>

        <div class="header-right">

            <div class="customer-name" id="customerName"></div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <section class="hero">

            <h1>
                My <span>Orders</span>
            </h1>

            <p>
                Track your custom garments and manage your tailor.
            </p>

        </section>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <div class="stat-number" id="totalCount">
                    0
                </div>

                <div class="stat-label">
                    Total Orders
                </div>

            </div>


            <div class="stat">

                <div class="stat-number" id="pendingCount">
                    0
                </div>

                <div class="stat-label">
                    Pending
                </div>

            </div>


            <div class="stat">

                <div class="stat-number" id="progressCount">
                    0
                </div>

                <div class="stat-label">
                    In Progress
                </div>

            </div>


            <div class="stat">

                <div class="stat-number" id="completedCount">
                    0
                </div>

                <div class="stat-label">
                    Completed
                </div>

            </div>

        </div>


        <!-- ORDERS -->

        <div id="ordersContainer">

            <div class="loading">
                Loading your orders...
            </div>

        </div>


    </main>


    <!-- ================= TAILOR MODAL ================= -->

    <div class="modal" id="tailorModal">

        <div class="modal-card">

            <div class="modal-head">

                <h2>
                    Choose Your Tailor
                </h2>

                <button class="close" onclick="closeTailorModal()">
                    ×
                </button>

            </div>


            <div id="tailorGrid" class="tailor-grid">

                <div class="loading">
                    Loading tailors...
                </div>

            </div>

        </div>

    </div>


    <script>


        /* =====================================================
           USER
        ===================================================== */

        const user =
            JSON.parse(
                localStorage.getItem(
                    "stichkartUser"
                ) || "null"
            );


        if (!user) {

            window.location.href =
                "/login.html";

        }


        /* =====================================================
           CUSTOMER NAME
        ===================================================== */

        if (user) {

            document.getElementById(
                "customerName"
            ).textContent =
                "Hi, " +
                (user.name || "Customer");

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout() {

            localStorage.removeItem(
                "stichkartUser"
            );

            window.location.href =
                "/login.html";

        }


        /* =====================================================
           VARIABLES
        ===================================================== */

        let allOrders = [];

        let selectedOrderId = null;

        let allTailors = [];


        /* =====================================================
           LOAD ORDERS
        ===================================================== */

        async function loadOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            try {

                const response =
                    await fetch(
                        "/api/orders?userId=" +
                        encodeURIComponent(user.id)
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Orders load nahi hue."
                    );

                }


                allOrders =
                    data.orders || [];


                updateStats(allOrders);

                renderOrders(allOrders);

            }
            catch (error) {

                console.error(error);

                container.innerHTML = `

            <div class="error">

                Orders load nahi ho rahe.

                <br><br>

                Check karo ki Node.js server running hai.

            </div>

        `;

            }

        }


        /* =====================================================
           STATS
        ===================================================== */

        function updateStats(orders) {

            document.getElementById(
                "totalCount"
            ).textContent =
                orders.length;


            document.getElementById(
                "pendingCount"
            ).textContent =
                orders.filter(
                    order =>
                        order.status ===
                        "Reference Pending"
                ).length;


            document.getElementById(
                "progressCount"
            ).textContent =
                orders.filter(
                    order =>
                        order.status === "Accepted" ||
                        order.status === "In Progress"
                ).length;


            document.getElementById(
                "completedCount"
            ).textContent =
                orders.filter(
                    order =>
                        order.status === "Completed"
                ).length;

        }


        /* =====================================================
           STATUS INDEX
        ===================================================== */

        function getStatusIndex(status) {

            const statuses = [

                "Reference Pending",
                "Accepted",
                "In Progress",
                "Ready",
                "Completed"

            ];


            const index =
                statuses.indexOf(status);


            return index === -1
                ? 0
                : index;

        }


        /* =====================================================
           ESCAPE
        ===================================================== */

        function escapeHTML(value) {

            if (
                value === undefined ||
                value === null
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           RENDER ORDERS
        ===================================================== */

        function renderOrders(orders) {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            if (!orders.length) {

                container.innerHTML = `

            <div class="empty">

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    Aapne abhi tak koi custom garment order nahi kiya.
                </p>

                <a
                    href="/"
                    class="shop"
                >
                    Create Your First Order
                </a>

            </div>

        `;

                return;

            }


            orders.sort(
                (a, b) =>
                    new Date(b.createdAt) -
                    new Date(a.createdAt)
            );


            container.innerHTML = `

        <div class="orders">

            ${orders
                    .map(
                        order =>
                            renderOrder(order)
                    )
                    .join("")}

        </div>

    `;

        }


        /* =====================================================
           RENDER SINGLE ORDER
        ===================================================== */

        function renderOrder(order) {

            const currentStep =
                getStatusIndex(
                    order.status
                );


            const createdDate =
                order.createdAt

                    ? new Date(
                        order.createdAt
                    ).toLocaleString(
                        "en-IN",
                        {
                            dateStyle: "medium",
                            timeStyle: "short"
                        }
                    )

                    : "Date unavailable";


            const design =
                order.designReference || {};


            let referenceButtons = "";


            /* DESIGN URL */

            if (design.url) {

                referenceButtons += `

            <a
                class="ref-btn"
                href="${escapeHTML(design.url)}"
                target="_blank"
                rel="noopener"
            >
                🔗 Open Design / Reel
            </a>

        `;

            }


            /* DESIGN FILE */

            if (design.fileData) {

                referenceButtons += `

            <button
                class="ref-btn"
                onclick="openFile('${escapeHTML(order.id)}')"
            >
                📎 Open Attached File
            </button>

        `;

            }


            if (!referenceButtons) {

                referenceButtons = `

            <span
                style="
                    color:#666;
                    font-size:13px;
                "
            >
                No design reference attached.
            </span>

        `;

            }


            const steps = [

                "Reference Pending",
                "Accepted",
                "In Progress",
                "Ready",
                "Completed"

            ];


            const timeline =
                steps
                    .map(
                        (step, index) => `

                    <div
                        class="step ${index <= currentStep
                                ? "active"
                                : ""
                            }"
                    >

                        <div class="dot"></div>

                        <div class="step-text">
                            ${step}
                        </div>

                    </div>

                `
                    )
                    .join("");


            /* TAILOR AREA */

            let tailorHTML = "";


            if (order.tailorId) {

                tailorHTML = `

            <div class="tailor-box">

                <div class="tailor-box-top">

                    <div>

                        <div class="tailor-label">
                            Assigned Tailor
                        </div>

                        <div class="tailor-name">

                            ✂️
                            ${escapeHTML(
                    order.tailorName ||
                    "Assigned Tailor"
                )}

                        </div>

                        <div class="tailor-location">

                            📍
                            ${escapeHTML(
                    order.tailorLocation ||
                    "Location unavailable"
                )}

                        </div>

                    </div>


                    <button
                        class="change-tailor"
                        onclick="
                            openTailorModal(
                                '${escapeHTML(order.id)}'
                            )
                        "
                    >
                        Change Tailor
                    </button>

                </div>

            </div>

        `;

            }
            else {

                tailorHTML = `

            <div class="tailor-box">

                <div class="tailor-box-top">

                    <div>

                        <div class="tailor-label">
                            Tailor
                        </div>

                        <div
                            class="tailor-name"
                            style="color:#aaa;"
                        >
                            No tailor selected yet
                        </div>

                        <div class="tailor-location">

                            Select a tailor to send your
                            custom stitching order.

                        </div>

                    </div>


                    <button
                        class="select-tailor-btn"
                        onclick="
                            openTailorModal(
                                '${escapeHTML(order.id)}'
                            )
                        "
                    >
                        Select Tailor
                    </button>

                </div>

            </div>

        `;

            }


            return `

        <article class="order-card">


            <!-- ORDER HEADER -->

            <div class="order-top">

                <div>

                    <div class="order-number">

                        ${escapeHTML(
                order.orderNumber
            )}

                    </div>

                    <div class="date">

                        ${createdDate}

                    </div>

                </div>


                <div class="status">

                    ${escapeHTML(
                order.status
            )}

                </div>

            </div>


            <!-- DETAILS -->

            <div class="details">


                <div class="detail">

                    <div class="detail-label">
                        Collection
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                order.gender
            )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Garment
                    </div>

                    <div class="detail-value">

                        ${escapeHTML(
                order.garment
            )}

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Fit Reference
                    </div>

                    <div class="detail-value">

                        ${order.physicalReferenceGarment

                    ? "✓ Physical garment given"

                    : "Not provided"
                }

                    </div>

                </div>


            </div>


            <!-- TAILOR -->

            ${tailorHTML}


            <!-- TIMELINE -->

            <div class="timeline">

                ${timeline}

            </div>


            <!-- DESIGN REFERENCE -->

            <div class="reference">

                <h3>
                    Design Reference
                </h3>


                <div class="reference-buttons">

                    ${referenceButtons}

                </div>


                <!-- INSTRUCTIONS -->

                <div class="instructions">

                    <div class="instructions-title">

                        Customer Instructions

                    </div>


                    <div class="instructions-text">

                        ${escapeHTML(
                    order.instructions ||
                    "No additional instructions."
                )
                }

                    </div>

                </div>


                <!-- FIT -->

                <div class="fit">

                    ${order.physicalReferenceGarment

                    ? "✓ Physical old garment will be used as the fit/proportion reference."

                    : "No physical fit-reference garment selected."
                }

                </div>


            </div>


        </article>

    `;

        }


        /* =====================================================
           OPEN TAILOR MODAL
        ===================================================== */

        async function openTailorModal(orderId) {

            selectedOrderId =
                orderId;


            document
                .getElementById(
                    "tailorModal"
                )
                .classList.add("show");


            const grid =
                document.getElementById(
                    "tailorGrid"
                );


            grid.innerHTML = `

        <div class="loading">

            Loading available tailors...

        </div>

    `;


            try {

                const response =
                    await fetch(
                        "/api/tailors"
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Tailors load nahi hue."
                    );

                }


                allTailors =
                    data.tailors || [];


                renderTailorSelection(
                    allTailors
                );

            }
            catch (error) {

                console.error(error);

                grid.innerHTML = `

            <div class="error">

                Tailors load nahi ho rahe.

            </div>

        `;

            }

        }


        /* =====================================================
           RENDER TAILORS IN MODAL
        ===================================================== */

        function renderTailorSelection(tailors) {

            const grid =
                document.getElementById(
                    "tailorGrid"
                );


            if (!tailors.length) {

                grid.innerHTML = `

            <div class="loading">

                No tailors available.

            </div>

        `;

                return;

            }


            grid.innerHTML =
                tailors
                    .map(
                        tailor =>
                            createTailorCard(
                                tailor
                            )
                    )
                    .join("");

        }


        /* =====================================================
           TAILOR CARD
        ===================================================== */

        function createTailorCard(tailor) {

            const initials =
                tailor.name
                    .split(" ")
                    .map(
                        word =>
                            word[0]
                    )
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            return `

        <div class="tailor-card">


            <div class="tailor-avatar">

                ${escapeHTML(
                initials
            )}

            </div>


            <div class="tailor-card-name">

                ${escapeHTML(
                tailor.name
            )}

            </div>


            <div class="tailor-card-specialization">

                ${escapeHTML(
                tailor.specialization
            )}

            </div>


            <div class="tailor-card-meta">

                <span>
                    ★ ${tailor.rating}
                </span>

                <span>
                    ${escapeHTML(
                tailor.experience
            )}
                </span>

            </div>


            <div
                style="
                    color:#777;
                    font-size:11px;
                    margin-top:8px;
                "
            >

                📍
                ${escapeHTML(
                tailor.location
            )}

            </div>


            <button
                class="assign-btn"
                onclick="
                    assignTailor(
                        '${escapeHTML(tailor.id)}'
                    )
                "
            >
                Select This Tailor
            </button>


        </div>

    `;

        }


        /* =====================================================
           ASSIGN TAILOR
        ===================================================== */

        async function assignTailor(tailorId) {

            if (!selectedOrderId) {

                return;

            }


            const tailor =
                allTailors.find(
                    item =>
                        String(item.id) ===
                        String(tailorId)
                );


            if (!tailor) {

                alert(
                    "Tailor not found."
                );

                return;

            }


            const confirmed =
                confirm(
                    `Select ${tailor.name} for this order?`
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/orders/${selectedOrderId}/tailor`,
                        {

                            method: "PATCH",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                tailorId:
                                    tailor.id

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    alert(
                        data.message ||
                        "Tailor assign nahi ho paya."
                    );

                    return;

                }


                closeTailorModal();


                /*
                 * Reload orders so the newly
                 * assigned tailor appears.
                 */

                await loadOrders();


                alert(
                    `✓ ${tailor.name} has been assigned to your order.`
                );

            }
            catch (error) {

                console.error(error);

                alert(
                    "Server error. Tailor assign nahi ho paya."
                );

            }

        }


        /* =====================================================
           CLOSE MODAL
        ===================================================== */

        function closeTailorModal() {

            document
                .getElementById(
                    "tailorModal"
                )
                .classList.remove("show");


            selectedOrderId =
                null;

        }


        /* =====================================================
           OPEN FILE
        ===================================================== */

        async function openFile(orderId) {

            try {

                const response =
                    await fetch(
                        "/api/orders"
                    );


                const data =
                    await response.json();


                const order =
                    data.orders.find(
                        item =>
                            String(item.id) ===
                            String(orderId)
                    );


                if (
                    !order ||
                    !order.designReference ||
                    !order.designReference.fileData
                ) {

                    alert(
                        "File available nahi hai."
                    );

                    return;

                }


                const fileData =
                    order.designReference.fileData;


                const newWindow =
                    window.open();


                if (!newWindow) {

                    alert(
                        "Safari ne popup block kar diya. Popups allow karo."
                    );

                    return;

                }


                if (
                    fileData.startsWith(
                        "data:image/"
                    )
                ) {

                    newWindow.document.write(`

                <html>

                <body
                    style="
                        margin:0;
                        background:#111;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        min-height:100vh;
                    "
                >

                    <img
                        src="${fileData}"
                        style="
                            max-width:95%;
                            max-height:95vh;
                            object-fit:contain;
                        "
                    >

                </body>

                </html>

            `);

                }
                else {

                    newWindow.document.write(`

                <html>

                <body
                    style="
                        font-family:Arial;
                        background:#111;
                        color:white;
                        padding:40px;
                        text-align:center;
                    "
                >

                    <h2>
                        Design File
                    </h2>

                    <p>
                        File ko open/download karne ke liye button dabayein.
                    </p>

                    <a
                        href="${fileData}"
                        download="${escapeHTML(
                        order.designReference.fileName ||
                        "stichkart-design"
                    )}"
                        style="
                            display:inline-block;
                            padding:14px 22px;
                            background:#d4af37;
                            color:#111;
                            text-decoration:none;
                            border-radius:10px;
                            font-weight:bold;
                        "
                    >
                        Open / Download File
                    </a>

                </body>

                </html>

            `);

                }

            }
            catch (error) {

                console.error(error);

                alert(
                    "File open nahi ho payi."
                );

            }

        }


        /* =====================================================
           START
        ===================================================== */

        if (user) {

            loadOrders();

        }

    </script>

</body>

</html>
